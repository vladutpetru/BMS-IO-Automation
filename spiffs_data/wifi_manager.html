<!DOCTYPE html>
<Html>  
<Head>
	<title>  
		Esp 01 Wifi Manager  
	</title> 
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style type=text/css>   
		body   
		{  
		height: 125vh;  
		margin-top: 80px;  
		padding: 30px;  
		background-size: cover;  
		font-family: sans-serif;  
		}  
		header {  
		background-color: orange;  
		position: fixed;  
		left: 0;  
		right: 0;  
		top: 5px;  
		height: 30px;  
		display: flex;  
		align-items: center;  
		box-shadow: 0 0 25px 0 black;  
		}  
		header * {  
		display: inline;  
		}  
		header li {  
		margin: 20px;  
		}  
		header li a {  
		color: blue;  
		text-decoration: none;  
		}  
	</style>   
</Head>  
	<Body>
	<center>
	<header>  
	<nav>  
		<ul>  
		<li>  
		<a href="read.html"> Citire parametri </a>  
		</li>  
		<li>  
		<a href="set.html"> Modificare parametru </a>  
		</li>  
		<li>  
		<a href="wifi_manager.html"> Manager Wifi </a>   
		</ul>  
	</nav> 
	</header>  	
	<form name="myform">
	<label for="ssid">Choose a wifi network:</label>
	<select name="ssids" id="ssids">
	</select>
	</form>
	</br>
		<label for="pwd">SSD Pwd (4 to 20 characters):</label>
		<input type="text" id="pwd" name="name" required
			   minlength="8" maxlength="20" size="10">
	</br>
		<button type="button" id ="connect">Connect</button>
	</br>
	</br>
		<button type="button" id ="getssdsfct">Refresh</button>
	</br>
	<script>
		document.getElementById ("connect").addEventListener ("click", exec_connect, false);
		document.getElementById ("getssdsfct").addEventListener ("click", get_ssdis, false);
		function exec_connect()
		{
			let ssid = document.getElementById("ssids").value;
			let pwd = document.getElementById("pwd").value;
			let req_ssid = "/set";
			let req_pwd = "/set";
			let reset = "/set?reset=true";
			let set_ssid = req_ssid.concat("?ssid=", ssid);
			let set_pwd = req_pwd.concat("?pwd=", pwd);
			httpGetAsync(set_ssid, function(result){
				res = result;
			});
			httpGetAsync(set_pwd, function(result){
				res = result;
			});	
			httpGetAsync(reset, function(result){
				res = result;
			});
			
		}
		function get_ssdis()
		{
			httpGetAsync('/get?ssids', function(result){
				res = result;
			});	
			list_resp = res.split(",");
			var v_ssids=document.myform.ssids;
			v_ssids.options.length=0;
			for (i=0; i<list_resp.length; i++){
				v_ssids.options[i]=new Option(list_resp[i], list_resp[i], true, false)
			}
		}
	</script>
	<script src="httpGetAsync.js"></script>
	</center>
	</Body>  
</Html>
