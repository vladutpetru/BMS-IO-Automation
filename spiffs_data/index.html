<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boiler controller</title>
<style>
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1c2530; --muted:#5b6673; --line:#d3d9df;
  --heat:#d9480f; --cold:#1971c2; --ok:#2b8a3e; --err:#c92a2a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161b21; --panel:#1f262e; --ink:#e6ebf0; --muted:#9aa5b1; --line:#34404b;
         --heat:#ff7a45; --cold:#4dabf7; --ok:#51cf66; --err:#ff6b6b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.375rem;margin:0 0 20px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
h2{font-size:1.125rem;margin:0 0 4px}
h3{font-size:1rem;margin:0}
.hint{margin:0 0 12px;color:var(--muted);font-size:.9375rem}

.reading{display:flex;align-items:baseline;gap:6px;margin:8px 0 0}
.reading output{font-size:3.5rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.reading span{font-size:1.5rem;color:var(--muted)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--line);margin:16px 0 6px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--cold);
             transition:width .6s ease,background-color .3s}
.gauge .fill.hot{background:var(--heat)}
.gauge .limit{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.scale{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--muted)}
.note{margin:8px 0 12px;color:var(--muted)}
.note.hot{color:var(--heat);font-weight:600}

form.row{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;
         padding-top:12px;border-top:1px solid var(--line)}
.row label{font-weight:600}

form.trigger{display:grid;grid-template-columns:auto auto 1fr;gap:8px 16px;align-items:end;
             padding:14px 0;border-top:1px solid var(--line)}
#triggers form.trigger:first-child{border-top:0;padding-top:4px}
.trigger h3{grid-column:1/-1}
.trigger .num{display:grid;gap:2px}
.trigger .num label{font-size:.875rem;color:var(--muted)}
.trigger button{justify-self:start}

.status{grid-column:1/-1;min-height:1.25em;font-size:.875rem;margin:0}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}

input[type=number]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;width:96px;text-align:right;font-variant-numeric:tabular-nums}
input[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:7px 16px;
       background:var(--ink);color:var(--panel);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--cold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.gauge .fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>BMS IO Automation</h1>

  <section aria-labelledby="boil-h">
    <h2 id="boil-h">Boiling</h2>
    <p class="reading"><output id="temp" aria-live="polite">--</output><span>°C</span></p>
    <div class="gauge" aria-hidden="true"><div class="fill" id="fill"></div><div class="limit" id="limit" hidden></div></div>
    <div class="scale" aria-hidden="true"><span>0 °C</span><span>125 °C</span></div>
    <p class="note" id="tempNote">Waiting for the first reading…</p>
    <form class="row" id="boilForm" novalidate>
      <label for="boilMax">Maximum temperature (°C)</label>
      <input type="number" id="boilMax" min="0" max="125" step="0.1" required>
      <button type="submit">Save</button>
      <p class="status" role="status"></p>
    </form>
  </section>

  <section aria-labelledby="trig-h">
    <h2 id="trig-h">Triggers</h2>
    <p class="hint">Whole numbers from 20 to 100. Max must be greater than min.</p>
    <div id="triggers"><p class="note">Loading…</p></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var GAUGE_MAX_C = 125;
  var TRIG_LO = 20, TRIG_HI = 100;
  var $ = function (id) { return document.getElementById(id); };
  var boilMaxC = null;
  var lastTemp = null;

  async function api(path, options) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 5000);
    try {
      var res = await fetch(path, Object.assign({ cache: 'no-store', signal: ctrl.signal }, options || {}));
      var text = await res.text();
      if (!res.ok) throw new Error(text.trim() || ('HTTP ' + res.status));
      return text ? JSON.parse(text) : {};
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('the device did not answer in time');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function postJson(path, body) {
    return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }

  function setStatus(form, msg, ok) {
    var s = form.querySelector('.status');
    s.textContent = msg;
    s.className = 'status ' + (msg ? (ok ? 'ok' : 'err') : '');
  }

  async function withBusy(form, fn) {
    var b = form.querySelector('button[type=submit]');
    b.disabled = true;
    try { await fn(); } finally { b.disabled = false; }
  }

  function readValue(input, min, max, integer) {
    var v = input.valueAsNumber;
    if (!Number.isFinite(v) || v < min || v > max) return null;
    if (integer && !Number.isInteger(v)) return null;
    return v;
  }

  function pct(v) { return Math.max(0, Math.min(100, v / GAUGE_MAX_C * 100)); }

  /* ---------- Boiling ---------- */
  function renderTemp() {
    var fill = $('fill'), note = $('tempNote');
    if (lastTemp === null) {
      $('temp').textContent = '--';
      fill.style.width = '0';
      note.textContent = 'No reading from the device. Retrying…';
      note.className = 'note';
      return;
    }
    $('temp').textContent = lastTemp.toFixed(1);
    fill.style.width = pct(lastTemp) + '%';
    var hot = boilMaxC !== null && lastTemp >= boilMaxC;
    fill.classList.toggle('hot', hot);
    if (boilMaxC === null) {
      note.textContent = '';
      note.className = 'note';
    } else if (hot) {
      note.textContent = 'Maximum reached (' + boilMaxC.toFixed(1) + ' °C).';
      note.className = 'note hot';
    } else {
      note.textContent = (boilMaxC - lastTemp).toFixed(1) + ' °C below the maximum.';
      note.className = 'note';
    }
  }

  function renderLimit() {
    var l = $('limit');
    if (boilMaxC === null) { l.hidden = true; return; }
    l.hidden = false;
    l.style.left = pct(boilMaxC) + '%';
    if (lastTemp !== null) renderTemp();
  }

  async function pollTemp() {
    try {
      var d = await api('/temperature');
      lastTemp = (typeof d.temp_c === 'number') ? d.temp_c : null;
    } catch (e) {
      lastTemp = null;
    }
    renderTemp();
    setTimeout(pollTemp, 2000);
  }

  $('boilForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.currentTarget;
    var v = readValue($('boilMax'), 0, GAUGE_MAX_C, false);
    if (v === null) { setStatus(form, 'Enter a value from 0 to 125 °C.', false); return; }
    withBusy(form, async function () {
      try {
        var d = await postJson('/api/boil', { boil_max_c: Math.round(v * 10) / 10 });
        boilMaxC = d.boil_max_c;
        $('boilMax').value = boilMaxC;
        renderLimit();
        setStatus(form, 'Saved: ' + boilMaxC.toFixed(1) + ' °C', true);
      } catch (err) {
        setStatus(form, 'Not saved: ' + err.message, false);
      }
    });
  });

  /* ---------- Triggers ---------- */
  /* Returns an error message, or null when min/max are valid */
  function checkTrigger(minEl, maxEl) {
    var lo = readValue(minEl, TRIG_LO, TRIG_HI, true);
    var hi = readValue(maxEl, TRIG_LO, TRIG_HI, true);
    minEl.setAttribute('aria-invalid', lo === null);
    maxEl.setAttribute('aria-invalid', hi === null);
    if (lo === null) return 'Min must be a whole number from 20 to 100.';
    if (hi === null) return 'Max must be a whole number from 20 to 100.';
    if (hi <= lo) {
      maxEl.setAttribute('aria-invalid', true);
      return 'Max must be greater than min.';
    }
    return null;
  }

  function buildTriggers(triggers) {
    var box = $('triggers');
    box.textContent = '';
    triggers.forEach(function (t) {
      var form = document.createElement('form');
      form.className = 'trigger';
      form.noValidate = true;
      form.innerHTML =
        '<h3></h3>' +
        '<div class="num"><label>Min</label><input type="number" min="20" max="100" step="1" required></div>' +
        '<div class="num"><label>Max</label><input type="number" min="20" max="100" step="1" required></div>' +
        '<button type="submit">Save</button>' +
        '<p class="status" role="status"></p>';
      form.querySelector('h3').textContent = t.name;
      var labels = form.querySelectorAll('label');
      var inputs = form.querySelectorAll('input');
      var minEl = inputs[0], maxEl = inputs[1];
      minEl.id = 'trig' + t.id + 'min';
      maxEl.id = 'trig' + t.id + 'max';
      labels[0].htmlFor = minEl.id;
      labels[1].htmlFor = maxEl.id;
      minEl.value = t.min;
      maxEl.value = t.max;

      function onEdit() {
        var msg = checkTrigger(minEl, maxEl);
        setStatus(form, msg || '', false);
      }
      minEl.addEventListener('input', onEdit);
      maxEl.addEventListener('input', onEdit);

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var msg = checkTrigger(minEl, maxEl);
        if (msg) { setStatus(form, msg, false); return; }
        var body = { id: t.id, min: minEl.valueAsNumber, max: maxEl.valueAsNumber };
        withBusy(form, async function () {
          try {
            var d = await postJson('/api/trigger', body);
            minEl.value = d.min;
            maxEl.value = d.max;
            setStatus(form, 'Saved: ' + d.min + ' – ' + d.max, true);
          } catch (err) {
            setStatus(form, 'Not saved: ' + err.message, false);
          }
        });
      });
      box.appendChild(form);
    });
  }

  async function loadSettings() {
    try {
      var d = await api('/api/settings');
      boilMaxC = d.boil_max_c;
      $('boilMax').value = boilMaxC;
      renderLimit();
      buildTriggers(d.triggers);
    } catch (e) {
      var box = $('triggers');
      box.textContent = '';
      var p = document.createElement('p');
      p.className = 'status err';
      p.textContent = 'Could not load settings: ' + e.message + '. Retrying in 5 s.';
      box.appendChild(p);
      setTimeout(loadSettings, 5000);
    }
  }

  pollTemp();
  loadSettings();
})();
</script>
</body>
</html>
